<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia Escolar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <div class="login-bg-pattern"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <svg viewBox="0 0 64 64" width="64" height="64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="16" width="56" height="40" rx="4" stroke="#2563eb" stroke-width="3"/>
                        <path d="M4 24h56" stroke="#2563eb" stroke-width="3"/>
                        <rect x="12" y="8" width="40" height="8" rx="2" stroke="#2563eb" stroke-width="3"/>
                        <circle cx="32" cy="38" r="6" stroke="#10b981" stroke-width="3"/>
                        <path d="M26 44c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#10b981" stroke-width="3"/>
                        <circle cx="18" cy="32" r="2" fill="#2563eb"/>
                        <circle cx="46" cy="32" r="2" fill="#2563eb"/>
                        <rect x="8" y="28" width="8" height="2" rx="1" fill="#2563eb"/>
                        <rect x="48" y="28" width="8" height="2" rx="1" fill="#2563eb"/>
                    </svg>
                </div>
                <h1>Sistema de Asistencia Escolar</h1>
                <p>Control de asistencia integral para instituciones educativas</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="cedula">Cédula</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="cedula" name="cedula" placeholder="Ingrese su cédula" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="loginError" class="login-error" style="display:none;"></div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-loading" style="display:none;">
                        <span class="spinner spinner-white"></span> Ingresando...
                    </span>
                </button>
            </form>
            <div class="login-footer">
                <p>&copy; 2025 Sistema de Asistencia Escolar. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="loading-content">
            <div class="spinner spinner-large"></div>
            <p>Cargando...</p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
