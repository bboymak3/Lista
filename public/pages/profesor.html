<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesor - Sistema de Asistencia Escolar</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Toggle (Mobile) -->
        <button id="sidebarToggle" class="sidebar-toggle">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
                </div>
                <div class="sidebar-brand-text">
                    Asistencia Escolar
                    <small>Panel de Profesor</small>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Navegación</div>
                    <a class="nav-item active" data-view="miclase" onclick="navigateTo('miclase')">
                        <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg></span>
                        <span class="nav-item-text">Mi Clase</span>
                    </a>
                    <a class="nav-item" data-view="historial" onclick="navigateTo('historial')">
                        <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
                        <span class="nav-item-text">Historial</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-item nav-logout" onclick="logout()">
                    <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                    <span class="nav-item-text">Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="page-header-left">
                    <h2 id="pageTitle">Mi Clase</h2>
                </div>
                <div class="page-header-right">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">P</div>
                        <div>
                            <span class="user-name" id="userName">Profesor</span>
                            <span class="user-role" id="userRole">Profesor</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-body">
                <!-- Mi Clase View -->
                <section id="view-miclase" class="view-section">
                    <div id="todayDate" class="mb-4" style="font-size:0.9375rem;color:var(--gray-500);"></div>

                    <!-- Schedule Cards -->
                    <div id="scheduleCards" class="schedule-cards">
                        <div class="empty-state">
                            <div class="empty-state-icon">📅</div>
                            <div class="empty-state-title">No hay clases hoy</div>
                            <div class="empty-state-text">Sus horarios de clase aparecerán aquí</div>
                        </div>
                    </div>

                    <!-- Active Session Panel -->
                    <div id="activeSession" style="display:none;">
                        <div class="card" style="margin-top:1.5rem;">
                            <div class="card-header" style="background:linear-gradient(135deg, var(--primary-lighter) 0%, var(--surface) 100%);">
                                <div>
                                    <h3 id="activeSessionTitle" style="display:flex;align-items:center;gap:0.5rem;">
                                        Clase en Curso
                                    </h3>
                                    <p id="sessionStartTime" style="font-size:0.8125rem;color:var(--gray-500);margin-top:0.25rem;"></p>
                                </div>
                                <button class="btn btn-danger btn-sm" onclick="profesorApp.finalizarClase()">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                                    Finalizar Clase
                                </button>
                            </div>
                            <div class="card-body" id="attendanceListContainer" style="padding-bottom:80px;">
                                <!-- Attendance items rendered here by JS -->
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Historial View -->
                <section id="view-historial" class="view-section" style="display:none;">
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
                        <h3>Historial de Asistencias</h3>
                        <div class="flex gap-2">
                            <select class="form-control" id="filterMateria" style="width:auto;" onchange="profesorApp.loadHistorial()">
                                <option value="">Todas las materias</option>
                            </select>
                            <input type="date" class="form-control" id="filterFecha" style="width:auto;" onchange="profesorApp.loadHistorial()">
                        </div>
                    </div>
                    <div class="card">
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Materia</th>
                                        <th>Aula</th>
                                        <th>Presentes</th>
                                        <th>Ausentes</th>
                                        <th>Tardanzas</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody id="historialTableBody">
                                    <tr><td colspan="7" class="table-empty"><div class="spinner"></div> Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="historialPagination"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="loading-content">
            <div class="spinner spinner-large"></div>
            <p>Cargando...</p>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/profesor.js"></script>
    <script>
        if (!checkAuth('profesor')) { /* redirected */ }
        else {
            initSidebar();
            initUserInfo();
            profesorApp.init();
        }
    </script>
</body>
</html>
