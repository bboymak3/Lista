<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesor - Sistema de Asistencia Escolar</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/libs/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <button id="sidebarToggle" class="sidebar-toggle">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
                </div>
                <div class="sidebar-brand-text">Asistencia Escolar<small>Panel de Profesor</small></div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Navegación</div>
                    <a class="nav-item active" data-view="miclase" onclick="navigateTo('miclase')">
                        <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg></span>
                        <span class="nav-item-text">Mi Clase</span>
                    </a>
                    <a class="nav-item" data-view="historial" onclick="navigateTo('historial')">
                        <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
                        <span class="nav-item-text">Historial</span>
                    </a>
                    <a class="nav-item" data-view="notas" onclick="navigateTo('notas')">
                        <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
                        <span class="nav-item-text">Notas</span>
                    </a>
                    <a class="nav-item" data-view="lapsos" onclick="navigateTo('lapsos')">
                        <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                        <span class="nav-item-text">Lapsos</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-item nav-logout" onclick="logout()">
                    <span class="nav-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                    <span class="nav-item-text">Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div class="page-header-left">
                    <h2 id="pageTitle">Mi Clase</h2>
                </div>
                <div class="page-header-right">
                    <div id="diarioStatus" style="margin-right:12px;"></div>
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">P</div>
                        <div><span class="user-name" id="userName">Profesor</span><span class="user-role" id="userRole">Profesor</span></div>
                    </div>
                </div>
            </header>

            <div class="page-body">
                <!-- Mi Clase View -->
                <section id="view-miclase" class="view-section">
                    <div id="todayDate" class="mb-4" style="font-size:0.9375rem;color:var(--gray-500);"></div>
                    <div id="scheduleCards" class="schedule-cards">
                        <div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">No hay clases hoy</div></div>
                    </div>
                    <div id="activeSession" style="display:none;">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h3 id="activeSessionTitle">Clase en Curso</h3>
                                <button class="btn btn-danger btn-sm" onclick="profesorApp.finalizarClase()">Finalizar Clase</button>
                            </div>
                            <div class="card-body" id="attendanceListContainer"></div>
                        </div>
                    </div>
                </section>

                <!-- Historial View -->
                <section id="view-historial" class="view-section" style="display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
                        <h3>Historial de Asistencias</h3>
                        <div style="display:flex;gap:0.5rem;">
                            <input type="date" class="form-control" id="filterFecha" style="width:auto;">
                        </div>
                    </div>
                    <div class="card"><div class="table-container"><table>
                        <thead><tr><th>Fecha</th><th>Materia</th><th>Aula</th><th>Presentes</th><th>Ausentes</th><th>Tardanzas</th><th>Total</th></tr></thead>
                        <tbody id="historialTableBody"><tr><td colspan="7" class="table-empty">Cargando...</td></tr></tbody>
                    </table></div><div id="historialPagination"></div></div>
                </section>

                <!-- Notas View -->
                <section id="view-notas" class="view-section" style="display:none;">
                    <div id="notasContainer"></div>
                </section>

                <!-- Lapsos View -->
                <section id="view-lapsos" class="view-section" style="display:none;">
                    <div id="lapsosContainer"></div>
                </section>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="loading-content"><div class="spinner spinner-large"></div><p>Cargando...</p></div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/profesor.js"></script>
    <script>
        if (!checkAuth('profesor')) { /* redirected */ }
        else {
            initSidebar();
            initUserInfo();
            profesorApp.init();
        }
    </script>
</body>
</html>
